<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MappHub</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell-ui.css">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: var(--app-bg); color: var(--app-text); }
    body { display: flex; flex-direction: column; overflow: hidden; }
    [hidden] { display: none !important; }
    #app-frame { flex: 1 1 auto; min-height: 0; width: 100%; border: none; display: block; }
    #install-bar { flex: none; position: relative; height: 28px; background: var(--app-card-bg); border-top: 1px solid var(--app-border); cursor: pointer; overflow: hidden; }
    #install-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--app-primary); opacity: 0.35; transition: width 0.2s; }
    #install-bar-text { position: relative; display: block; padding: 0 12px; line-height: 28px; font-size: 0.8rem; color: var(--app-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #install-console { position: fixed; left: 0; right: 0; bottom: 0; height: 50vh; z-index: 8000; display: flex; flex-direction: column; background: var(--app-card-bg); border-top: 1px solid var(--app-border); box-shadow: 0 -6px 16px rgba(0,0,0,0.4); }
    .console-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--app-border); font-weight: 600; }
    .console-head button { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; background: var(--app-primary); color: white; }
    #install-log { flex: 1 1 auto; margin: 0; padding: 10px 12px; overflow-y: auto; font: 12px/1.45 monospace; white-space: pre-wrap; color: var(--app-text); }
    .modal-radio-group { margin-top: 8px; }
    #system-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 9999; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
    }
    .modal-card {
      background: var(--app-card-bg); border: 1px solid var(--app-border); border-radius: var(--app-radius);
      padding: 24px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box;
    }
    .modal-card h3 { margin: 0 0 12px; font-size: 1.2rem; }
    .modal-card p { margin: 0 0 12px; color: var(--app-text-muted); font-size: 0.95rem; line-height: 1.4; white-space: pre-line; }
    .modal-check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; cursor: pointer; font-size: 0.95rem; }
    .modal-check input { margin-top: 3px; }
    #modal-progress { height: 8px; background: var(--app-border); border-radius: 4px; overflow: hidden; margin: 12px 0; }
    #modal-progress-bar { height: 100%; width: 0; background: var(--app-primary); transition: width 0.2s; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .modal-actions button { padding: 10px 16px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; }
    .modal-actions button:disabled { opacity: 0.5; cursor: default; }
    .btn-primary { background: var(--app-primary); color: white; }
    .btn-primary:hover { background: var(--app-primary-hover); }
    .btn-secondary { background: transparent; color: var(--app-text); border: 1px solid var(--app-border) !important; }
  </style>
</head>
<body>
  <iframe id="app-frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

  <div id="install-bar" hidden>
    <div id="install-bar-fill"></div>
    <span id="install-bar-text"></span>
  </div>

  <div id="svc-host" class="svc-hidden"></div>

  <div id="install-console" hidden>
    <div class="console-head">
      <span id="install-console-title">Установка</span>
      <button id="install-console-close" hidden>Закрыть</button>
    </div>
    <pre id="install-log"></pre>
  </div>

  <div id="system-modal">
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <p id="modal-message"></p>
      <div id="modal-checks"></div>
      <div id="modal-progress" hidden><div id="modal-progress-bar"></div></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script type="module" src="js/runtime.js"></script>
</body>
</html>
