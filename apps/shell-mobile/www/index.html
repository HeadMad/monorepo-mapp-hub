<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MappHub</title>
  <!-- CSS активной темы отдаёт нативный слой: MappLocalAssetHandler -> www/assets/theme.css.js -->
  <link id="mapp-theme-css" rel="stylesheet" href="https://mapp.local/theme.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell-ui.css">
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: var(--app-bg); color: var(--app-text); }
    body { display: flex; flex-direction: column; overflow: hidden; }
    [hidden] { display: none !important; }
    #app-frame { flex: 1 1 auto; min-height: 0; width: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="app-frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

  <div id="svc-host" class="svc-hidden"></div>
  <div id="console-host" class="svc-hidden"></div>
  <div id="dialog-host" class="svc-hidden"></div>

  <script type="module" src="js/runtime.js"></script>
</body>
</html>
