name: Build Android Shell APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Capacitor CLI
        run: |
          cd apps/shell-mobile
          npm install

      - name: Add Android Platform & Build Web Assets
        run: |
          cd apps/shell-mobile
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK (Debug/Release)
        run: |
          cd apps/shell-mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapphub-shell-android-debug
          path: apps/shell-mobile/android/app/build/outputs/apk/debug/app-debug.apk
