name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза без префикса v, например 0.3.0-beta.1'
        required: true
        default: '0.3.0-beta.1'
      prerelease:
        description: 'Отметить релиз как pre-release'
        type: boolean
        default: true
      release_notes:
        description: 'Описание релиза (необязательно, иначе возьмется из docs/releases/<версия>.md)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      APK_NAME: mapphub-shell-v${{ inputs.version }}.apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "Версия должна быть semver: X.Y.Z или X.Y.Z-beta.N"; exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor dependencies
        working-directory: apps/shell-mobile
        run: npm install

      - name: Pack mini-app archives and SDK
        run: |
          node scripts/pack-miniapps.mjs
          mkdir -p apps/shell-mobile/www/assets
          cp miniapps/_sdk/MappHub.js apps/shell-mobile/www/assets/MappHub.js

      - name: Generate Android project
        working-directory: apps/shell-mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Add Rhino dependency for mapp.local generators
        working-directory: apps/shell-mobile/android/app
        run: sed -i 's|^dependencies {|dependencies {\n    implementation "org.mozilla:rhino:1.7.15"|' build.gradle && grep -n "rhino" build.gradle

      - name: Inject MappHub native layer
        run: |
          PKG_DIR=apps/shell-mobile/android/app/src/main/java/com/mapphub/shell
          ASSET_DIR=apps/shell-mobile/android/app/src/main/assets/mapp_shared
          mkdir -p "$PKG_DIR" "$ASSET_DIR"
          cp apps/shell-mobile/native/android/com/mapphub/shell/*.java "$PKG_DIR/"
          cp miniapps/_sdk/MappHub.js "$ASSET_DIR/MappHub.js"

      - name: Set versionName and stable versionCode
        working-directory: apps/shell-mobile/android/app
        run: |
          # versionCode монотонно растет: major*10000 + minor*100 + patch, чтобы Android принял обновление поверх старой версии
          CODE=$(python3 - "$VERSION" << 'PY'
          import re, sys
          m = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?', sys.argv[1])
          base = (int(m.group(1))*10000 + int(m.group(2))*100 + int(m.group(3))) * 100
          if m.group(4) is None:
              stage = 99
          else:
              stage = {'alpha': 0, 'beta': 20, 'rc': 50}[m.group(4)] + int(m.group(5))
              assert 0 < stage < 99, 'pre-release number out of range'
          print(base + stage)
          PY
          )
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \".*\"/versionName \"$VERSION\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Write release signing config
        working-directory: apps/shell-mobile/android/app
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties << EOP
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KEY_PASS
          EOP
          python3 - << 'PY'
          import re
          p = "build.gradle"
          s = open(p).read()
          cfg = """
          def keystoreProps = new Properties()
          def keystoreFile = file("keystore.properties")
          if (keystoreFile.exists()) { keystoreProps.load(new FileInputStream(keystoreFile)) }

          android {
              signingConfigs {
                  release {
                      storeFile file(keystoreProps['storeFile'])
                      storePassword keystoreProps['storePassword']
                      keyAlias keystoreProps['keyAlias']
                      keyPassword keystoreProps['keyPassword']
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.release }
              }
          }
          """
          s = s.rstrip() + "\n" + cfg
          open(p, "w").write(s)
          PY

      - name: Build signed release APK
        working-directory: apps/shell-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp apps/shell-mobile/android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Verify signature
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK_NAME" | head -5 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapphub-shell-v${{ inputs.version }}
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi
          NOTES_FILE="docs/releases/v$VERSION.md"
          if [ -n "$NOTES_INPUT" ]; then
            printf '%s\n' "$NOTES_INPUT" > release-notes.md
          elif [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release-notes.md
          else
            echo "Нет описания релиза: заполни release_notes или добавь $NOTES_FILE"; exit 1
          fi
          gh release create "v$VERSION" "$APK_NAME" dist/miniapps/* \
            --target "$GITHUB_SHA" \
            --title "MappHub Shell v$VERSION" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG
