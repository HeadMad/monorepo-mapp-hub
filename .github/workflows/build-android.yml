name: Build Android Shell APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Capacitor CLI
        run: |
          cd apps/shell-mobile
          npm install
          npm install -g @capacitor/cli @capacitor/core

      - name: Add Android Platform & Build Web Assets
        run: |
          cd apps/shell-mobile
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK (Debug/Release)
        run: |
          cd apps/shell-mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapphub-shell-android-debug
          path: apps/shell-mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: apps/shell-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          name: MappHub Shell v0.1.0-beta.1
          body: |
            ## MappHub Shell v0.1.0-beta.1 (Pre-Alpha / Beta)
            
            - Initial experimental build with dynamic RPC bridge.
            - Universal modal window for system notices & permissions.
            - Folder-based task tracking structure.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
