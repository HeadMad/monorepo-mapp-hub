name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза без префикса v'
        required: true
        default: '0.1.0-beta.1'
      prerelease:
        description: 'Отметить релиз как pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      APK_NAME: mapphub-shell-v${{ inputs.version }}.apk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor dependencies
        working-directory: apps/shell-mobile
        run: npm install

      - name: Bundle mini-apps into web assets
        run: |
          mkdir -p apps/shell-mobile/www/miniapps
          cp -r miniapps/launcher miniapps/sample-game apps/shell-mobile/www/miniapps/

      - name: Generate Android project
        working-directory: apps/shell-mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: apps/shell-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp apps/shell-mobile/android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapphub-shell-v${{ inputs.version }}
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRERELEASE_FLAG="--prerelease"; fi
          cat > release-notes.md << 'NOTES'
          Первая сборка оболочки, которую можно пощупать руками. Это бета, так что шероховатости ожидаемы.

          Что внутри:
          - RPC-мост между оболочкой и мини-приложениями в стиле Telegram Bot API
          - Динамически подгружаемые API-экшены (device, notifications, storage)
          - Единое модальное окно для системных уведомлений
          - Лаунчер и демо-мини-приложение внутри APK

          Пока не готово: установка мини-приложений с чекбоксами разрешений, прогресс-бар, самообновление оболочки.
          NOTES
          gh release create "v$VERSION" "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "MappHub Shell v$VERSION" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG
