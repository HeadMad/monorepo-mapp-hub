<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Sample HTML5 Game</title>
  <script src="https://mapp.local/MappHub.js"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 30px; text-align: center; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px; }
    .back { background: #334155; }
    #output { margin: 20px auto; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155;
      text-align: left; font-family: monospace; font-size: 0.9rem; max-width: 400px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Sample Mini-App</h1>
  <button onclick="getDeviceInfo()">Информация об устройстве</button>
  <button onclick="showAlert()">Вызвать уведомление</button><br>
  <button class="back" onclick="goBack()">Назад в лаунчер</button>
  <div id="output">Готов к вызовам</div>
  <script>
    const output = document.getElementById("output");

    async function getDeviceInfo() {
      try {
        output.textContent = JSON.stringify(await MappHub.call("device.info"), null, 2);
      } catch (err) {
        output.textContent = "Ошибка: " + err.message;
      }
    }
    function showAlert() {
      MappHub.call("notifications.alert", { title: "Mini-App", message: "Привет из мини-приложения!" });
    }
    function goBack() {
      MappHub.call("shell.navigate", { url: "miniapps/launcher/index.html" });
    }
  </script>
</body>
</html>
