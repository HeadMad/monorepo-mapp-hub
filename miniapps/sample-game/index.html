<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Sample HTML5 Game</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 30px; text-align: center; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px; }
    .back { background: #334155; }
    #output { margin: 20px auto; background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155;
      text-align: left; font-family: monospace; font-size: 0.9rem; max-width: 400px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Sample Mini-App</h1>
  <button onclick="getDeviceInfo()">Информация об устройстве</button>
  <button onclick="showAlert()">Вызвать уведомление</button><br>
  <button class="back" onclick="goBack()">Назад в лаунчер</button>
  <div id="output">Готов к RPC-вызовам</div>
  <script>
    let rpcId = 1;
    function callRpc(method, params = {}) {
      return new Promise((resolve, reject) => {
        const id = "req_" + rpcId++;
        const handler = (event) => {
          if (event.data && event.data.jsonrpc === "2.0" && event.data.id === id) {
            window.removeEventListener("message", handler);
            event.data.error ? reject(event.data.error) : resolve(event.data.result);
          }
        };
        window.addEventListener("message", handler);
        window.parent.postMessage({ jsonrpc: "2.0", method, params, id }, "*");
      });
    }
    async function getDeviceInfo() {
      const out = document.getElementById("output");
      try { out.textContent = JSON.stringify(await callRpc("device.info"), null, 2); }
      catch (err) { out.textContent = "Ошибка: " + JSON.stringify(err); }
    }
    async function showAlert() {
      await callRpc("notifications.alert", { title: "Mini-App", message: "Привет из мини-приложения!" });
    }
    async function goBack() {
      await callRpc("shell.navigate", { url: "../launcher/index.html" });
    }
  </script>
</body>
</html>
