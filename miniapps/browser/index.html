<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Браузер</title>
  <script src="https://mapp.local/MappHub.js"></script>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--app-bg, #0f172a); color: var(--app-text, #f8fafc); font-family: sans-serif; }
    body { position: relative; }
    [hidden] { display: none !important; }
    #bar { position: absolute; top: 0; left: 0; right: 0; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: var(--app-card-bg, #1e293b); border-bottom: 1px solid var(--app-border, #334155); }
    #title { flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
    .slot { flex: none; width: 36px; height: 36px; padding: 0; border: none; border-radius: 8px; background: transparent; color: inherit; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .slot:active { background: rgba(255, 255, 255, 0.12); }
    .slot img { width: 22px; height: 22px; object-fit: contain; }
    #page { position: absolute; top: 44px; left: 0; width: 100%; height: calc(100% - 44px); border: none; background: #fff; }
    #menu { position: absolute; top: 40px; right: 6px; min-width: 200px; padding: 4px; box-sizing: border-box; background: var(--app-card-bg, #1e293b); border: 1px solid var(--app-border, #334155); border-radius: 10px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45); z-index: 10; }
    .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: none; border-radius: 6px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .menu-item:active { background: rgba(255, 255, 255, 0.1); }
    .menu-icon { width: 22px; text-align: center; flex: none; }
    .menu-icon img { width: 20px; height: 20px; object-fit: contain; }
    #fs { position: absolute; z-index: 9; display: none; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 50%; background: rgba(0, 0, 0, 0.6); color: #fff; cursor: pointer; }
    .pos-top-left { top: 8px; left: 8px; }
    .pos-top-right { top: 8px; right: 8px; }
    .pos-bottom-left { bottom: 8px; left: 8px; }
    .pos-bottom-right { bottom: 8px; right: 8px; }
    body[data-mode="closed"] #bar, body[data-mode="closed"] #page { display: none; }
    body[data-mode="minimized"] #page, body[data-mode="minimized"] #fs { display: none; }
    body[data-mode="fullscreen"] #bar { display: none; }
    body[data-mode="fullscreen"] #page { top: 0; height: 100%; }
    body[data-mode="fullscreen"] #fs { display: flex; }
  </style>
</head>
<body data-mode="closed">
  <div id="bar">
    <button id="left" class="slot" hidden></button>
    <div id="title"></div>
    <button id="right" class="slot" hidden></button>
    <button id="menu-btn" class="slot" hidden></button>
  </div>
  <div id="menu" hidden></div>
  <iframe id="page" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  <button id="fs" type="button" aria-label="На весь экран"></button>

  <script>
    (function () {
      const BAR_H = 44;
      const FS_DEFAULT = { icon: "⤢", size: 36, opacity: 0.5, position: "top-right" };
      const FS_POSITIONS = ["top-left", "top-right", "bottom-left", "bottom-right"];
      const APP_ID_RE = /^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)+$/i;

      const PRESETS = {
        close: { icon: "✕", run: () => close() },
        back: { icon: "←", run: () => back() },
        minimize: { icon: "–", run: () => minimize() },
        fullscreen: { icon: "⤢", run: () => fullscreen({ enabled: true }) },
        reload: { icon: "⟳", run: () => reload() },
      };

      const bar = document.getElementById("bar");
      const titleEl = document.getElementById("title");
      const leftBtn = document.getElementById("left");
      const rightBtn = document.getElementById("right");
      const menuBtn = document.getElementById("menu-btn");
      const menuEl = document.getElementById("menu");
      const page = document.getElementById("page");
      const fsBtn = document.getElementById("fs");

      let mode = "closed";
      let cfg = null;
      let trail = [];
      let hostedAppId = null;

      function runSafe(fn) {
        Promise.resolve()
          .then(fn)
          .catch((err) => console.error(err && err.message ? err.message : String(err)));
      }

      function isImage(icon) {
        return /^(https?:\/\/|data:image\/)/.test(icon);
      }

      function setIcon(el, icon) {
        el.replaceChildren();
        if (!icon) return;
        if (isImage(icon)) {
          const img = document.createElement("img");
          img.alt = "";
          img.src = icon;
          el.append(img);
        } else {
          el.textContent = icon;
        }
      }

      function toHttpUrl(value) {
        let url;
        try {
          url = new URL(String(value ?? ""));
        } catch {
          throw new Error("Некорректный URL");
        }
        if (url.protocol !== "https:" && url.protocol !== "http:") {
          throw new Error("Разрешены только http и https");
        }
        return url.href;
      }

      function miniAppUrl(appId) {
        const id = String(appId ?? "");
        if (!APP_ID_RE.test(id)) throw new Error("Некорректный id приложения");
        return `https://miniapp-${id}.local/index.html`;
      }

      function appIdFromUrl(url) {
        const match = /^https:\/\/miniapp-([a-z][a-z0-9]*(?:\.[a-z][a-z0-9]*)+)\.local\//i.exec(url);
        return match ? match[1] : null;
      }

      function showPage(url) {
        hostedAppId = appIdFromUrl(url);
        page.src = url;
      }

      function requireOpen() {
        if (mode === "closed") throw new Error("Браузер не открыт");
      }

      function slotAction(spec) {
        if (spec.preset) {
          const preset = PRESETS[spec.preset];
          if (!preset) throw new Error(`Неизвестный пресет кнопки: ${spec.preset}`);
          return { icon: spec.icon || preset.icon, run: preset.run };
        }
        const onTap = typeof spec.onTap === "function" ? spec.onTap : null;
        return { icon: spec.icon || "", run: onTap ? () => onTap() : () => {} };
      }

      function renderSlot(btn, spec) {
        btn.hidden = !spec;
        if (!spec) return;
        const action = slotAction(spec);
        setIcon(btn, action.icon);
        btn.onclick = () => runSafe(action.run);
      }

      function openMenu() {
        if (!cfg || !Array.isArray(cfg.menu)) return;
        menuEl.replaceChildren(...cfg.menu.map((item) => {
          const btn = document.createElement("button");
          btn.className = "menu-item";
          const icon = document.createElement("span");
          icon.className = "menu-icon";
          setIcon(icon, item.icon || "");
          const label = document.createElement("span");
          label.textContent = item.title || "";
          btn.append(icon, label);
          btn.onclick = () => {
            closeMenu();
            runSafe(() => (typeof item.onTap === "function" ? item.onTap() : undefined));
          };
          return btn;
        }));
        menuEl.hidden = false;
      }

      function closeMenu() {
        menuEl.hidden = true;
      }

      function renderBar() {
        const left = cfg.left === undefined ? { preset: "close" } : cfg.left;
        renderSlot(leftBtn, left);
        renderSlot(rightBtn, cfg.right || null);
        menuBtn.hidden = !Array.isArray(cfg.menu);
        setIcon(menuBtn, cfg.menuIcon || "⋮");
        titleEl.textContent = cfg.title || "";
        closeMenu();
      }

      function renderFullscreenButton() {
        const fs = { ...FS_DEFAULT, ...((cfg && cfg.fullscreen) || {}) };
        const size = Math.min(96, Math.max(20, Number(fs.size) || FS_DEFAULT.size));
        const opacity = Math.min(1, Math.max(0, Number(fs.opacity)));
        const position = FS_POSITIONS.includes(fs.position) ? fs.position : FS_DEFAULT.position;
        fsBtn.style.width = `${size}px`;
        fsBtn.style.height = `${size}px`;
        fsBtn.style.fontSize = `${Math.round(size * 0.5)}px`;
        fsBtn.style.opacity = String(Number.isFinite(opacity) ? opacity : FS_DEFAULT.opacity);
        fsBtn.className = `pos-${position}`;
        setIcon(fsBtn, fs.icon || FS_DEFAULT.icon);
      }

      function layout(name, height) {
        return MappHub.call("host.setLayout", { mode: name, height: height || 0 });
      }

      async function setMode(next) {
        mode = next;
        document.body.dataset.mode = next;
        if (next === "closed") {
          closeMenu();
          hostedAppId = null;
          page.src = "about:blank";
          return layout("hidden");
        }
        if (next === "minimized") {
          closeMenu();
          return layout("dock", BAR_H);
        }
        return layout("overlay");
      }

      async function open(params = {}) {
        const url = params.appId ? miniAppUrl(params.appId) : toHttpUrl(params.url);
        cfg = params;
        trail = [url];
        renderBar();
        renderFullscreenButton();
        showPage(url);
        await setMode("open");
        return { ok: true };
      }

      async function navigate(params = {}) {
        requireOpen();
        const url = toHttpUrl(params.url);
        trail.push(url);
        showPage(url);
        return { ok: true };
      }

      async function close() {
        cfg = null;
        trail = [];
        await setMode("closed");
        return { ok: true };
      }

      async function minimize() {
        requireOpen();
        await setMode("minimized");
        return { ok: true };
      }

      async function restore() {
        requireOpen();
        await setMode("open");
        return { ok: true };
      }

      async function fullscreen(params = {}) {
        requireOpen();
        await setMode(params.enabled ? "fullscreen" : "open");
        return { ok: true };
      }

      function back() {
        if (trail.length < 2) return;
        trail.pop();
        showPage(trail[trail.length - 1]);
      }

      function reload() {
        if (trail.length) showPage(trail[trail.length - 1]);
      }

      async function relay(appId, msg) {
        const reply = (body) => {
          if (page.contentWindow) page.contentWindow.postMessage({ jsonrpc: "2.0", id: msg.id, ...body }, `https://miniapp-${appId}.local`);
        };
        try {
          const result = await MappHub.call("host.relay", { appId, message: { method: msg.method, params: msg.params || {} } });
          reply({ result: result ?? null });
        } catch (err) {
          reply({ error: { message: err && err.message ? err.message : String(err) } });
        }
      }

      window.addEventListener("message", (event) => {
        if (!hostedAppId || event.source !== page.contentWindow) return;
        if (event.origin !== `https://miniapp-${hostedAppId}.local`) return;
        const msg = event.data;
        if (!msg || msg.jsonrpc !== "2.0" || typeof msg.method !== "string" || msg.id === undefined) return;
        relay(hostedAppId, msg);
      });

      menuBtn.onclick = (event) => {
        event.stopPropagation();
        if (menuEl.hidden) openMenu();
        else closeMenu();
      };
      document.addEventListener("pointerdown", (event) => {
        if (!menuEl.hidden && !menuEl.contains(event.target) && event.target !== menuBtn) closeMenu();
      });
      fsBtn.onclick = () => runSafe(() => fullscreen({ enabled: false }));
      bar.addEventListener("click", (event) => {
        if (mode === "minimized" && !event.target.closest("button")) runSafe(restore);
      });

      MappHub.expose({
        "browser.open": open,
        "browser.navigate": navigate,
        "browser.close": close,
        "browser.minimize": minimize,
        "browser.restore": restore,
        "browser.fullscreen": fullscreen,
      });
    })();
  </script>
</body>
</html>
