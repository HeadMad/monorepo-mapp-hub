<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MappHub Launcher</title>
  <script src="https://mapp.local/MappHub.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; position: relative; margin: 0 0 4px; }
    h1 { margin: 0; font-size: 1.4rem; }
    #gear { background: none; border: none; color: #94a3b8; font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
    #gear:active { background: rgba(255, 255, 255, 0.08); }
    #settings-menu { position: absolute; top: 100%; right: 0; min-width: 220px; padding: 4px; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; border-radius: 10px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45); z-index: 5; }
    #settings-menu[hidden] { display: none; }
    .menu-item { display: block; width: 100%; padding: 12px; border: none; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .menu-item:active { background: rgba(255, 255, 255, 0.08); }
    #status { color: #94a3b8; font-size: 0.9rem; margin: 0 0 20px; min-height: 1.2em; }
    #status.error { color: #f87171; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 20px 12px; }
    .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: none; color: inherit; cursor: pointer; padding: 4px; font: inherit; }
    .tile:active .icon { transform: scale(0.94); }
    .icon { width: 64px; height: 64px; border-radius: 16px; background: var(--tile-color); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; color: #fff; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.35); transition: transform 0.1s; }
    .icon img { width: 100%; height: 100%; object-fit: cover; }
    .label { font-size: 0.8rem; text-align: center; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>MappHub</h1>
    <button id="gear" aria-label="Настройки">⚙</button>
    <div id="settings-menu" hidden>
      <button id="menu-console" class="menu-item">Консоль</button>
    </div>
  </header>
  <p id="status">Загрузка приложений...</p>
  <div id="grid" class="grid"></div>
  <script>
    const LAUNCHER_ID = "com.mapphub.launcher";
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    const gearEl = document.getElementById("gear");
    const settingsEl = document.getElementById("settings-menu");
    const consoleItemEl = document.getElementById("menu-console");

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = isError ? "error" : "";
    }

    function colorFor(id) {
      let hash = 0;
      for (const ch of id) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
      return `hsl(${hash % 360} 55% 42%)`;
    }

    function tileFor(app) {
      const tile = document.createElement("button");
      tile.className = "tile";
      tile.onclick = () => launch(app.id);

      const icon = document.createElement("div");
      icon.className = "icon";
      icon.style.setProperty("--tile-color", colorFor(app.id));
      if (app.icon) {
        const img = document.createElement("img");
        img.alt = "";
        img.src = `https://miniapp-${app.id}.local/${app.icon}`;
        img.onerror = () => {
          img.remove();
          icon.textContent = app.name.charAt(0).toUpperCase();
        };
        icon.append(img);
      } else {
        icon.textContent = app.name.charAt(0).toUpperCase();
      }

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = app.name;
      tile.append(icon, label);
      return tile;
    }

    function launch(appId) {
      MappHub.call("shell.navigate", { appId }).catch((err) => setStatus(`Не удалось открыть: ${err.message}`, true));
    }

    async function loadApps() {
      if (typeof MappHub === "undefined") {
        setStatus("MappHub SDK недоступен", true);
        return;
      }
      try {
        const { apps } = await MappHub.call("miniapp.list");
        const visible = apps.filter((app) => app.id !== LAUNCHER_ID && !app.service);
        gridEl.replaceChildren(...visible.map(tileFor));
        setStatus(visible.length ? "" : "Нет установленных приложений");
      } catch (err) {
        setStatus(`Не удалось загрузить список: ${err.message}`, true);
      }
    }

    gearEl.onclick = (e) => {
      e.stopPropagation();
      settingsEl.hidden = !settingsEl.hidden;
    };

    document.addEventListener("click", (e) => {
      if (!settingsEl.contains(e.target)) settingsEl.hidden = true;
    });

    consoleItemEl.onclick = () => {
      settingsEl.hidden = true;
      MappHub.bus.publish("shell.console.toggle").catch((err) => {
        setStatus(`Не удалось переключить консоль: ${err.message}`, true);
      });
    };

    loadApps();
  </script>
</body>
</html>
